name: CI

on:
  push:
  pull_request:

jobs:
  qemu-legomem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure QEMU LegoMem integration
        run: cmake -S qemu_integration -B build/qemu-legomem -DCMAKE_BUILD_TYPE=Release

      - name: Build QEMU LegoMem integration
        run: cmake --build build/qemu-legomem -j2

      - name: Test QEMU LegoMem integration
        run: ctest --test-dir build/qemu-legomem --output-on-failure

      - name: Check vendored QEMU LegoMem backend wiring
        run: |
          test -f library/qemu/backends/hostmem-legomem.c
          grep -q "hostmem-legomem.c" library/qemu/backends/meson.build
          grep -q "TYPE_MEMORY_BACKEND_LEGOMEM" library/qemu/include/system/hostmem.h
