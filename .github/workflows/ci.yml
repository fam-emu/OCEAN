name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  qemu-legomem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcxxopts-dev libspdlog-dev

      - name: Configure LegoMem
        run: cmake -S . -B build/legomem -DCMAKE_BUILD_TYPE=Release

      - name: Build LegoMem test targets
        run: cmake --build build/legomem --target test_slugarch_model qemu_legomem test_qemu_legomem_api legomem_server -j2

      - name: Test LegoMem
        run: ctest --test-dir build/legomem --output-on-failure

      - name: Check vendored QEMU LegoMem backend wiring
        run: |
          test -f library/qemu/backends/hostmem-legomem.c
          grep -q "hostmem-legomem.c" library/qemu/backends/meson.build
          grep -q "TYPE_MEMORY_BACKEND_LEGOMEM" library/qemu/include/system/hostmem.h

  vm-assets:
    runs-on: ubuntu-latest
    needs: qemu-legomem
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install asset build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap e2fsprogs linux-image-generic

      - name: Build qemu.img and bzImage
        run: script/build_legomem_vm_assets.sh dist

      - name: Upload VM assets
        uses: actions/upload-artifact@v4
        with:
          name: legomem-vm-assets
          path: |
            dist/qemu.img
            dist/bzImage
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qemu.img
            dist/bzImage
            dist/SHA256SUMS
