# Localization & Timezone
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string US/Central
d-i clock-setup/utc boolean true

# Network Configuration
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string local

# Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Account Setup
d-i passwd/root-login boolean true
d-i passwd/root-password password victor129
d-i passwd/root-password-again password victor129
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Packer User
d-i passwd/username string ocean
d-i passwd/user-password password victor129
d-i passwd/user-password-again password victor129

# --- FULLY AUTOMATED PARTITIONING (NO SWAP, NO PROMPTS) ---
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular

# Wipe out any preexisting LVM or MD RAID setups to avoid warning dialogs
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/purge_lvm_from_device boolean true

#### Partitioning — single ext4 partition, whole disk
# This produces /dev/sda1 as root.
# root=/dev/sda1 in your QEMU -append matches this.
d-i partman-auto/method             string  regular
d-i partman-auto/disk               string  /dev/sda
d-i partman-auto/expert_recipe      string  \
        singleroot ::                        \
            500 10000 -1 ext4               \
                $primary{ } $bootable{ }    \
                method{ format } format{ }  \
                use_filesystem{ }           \
                filesystem{ ext4 }          \
                mountpoint{ / }             \
            .
d-i partman-auto/choose_recipe      select  singleroot
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition        select  finish
d-i partman/confirm                 boolean true
d-i partman/confirm_nooverwrite     boolean true
d-i partman-basicfilesystems/no_swap boolean false

# Package Selection
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo openssh-server

# Bootloader Installation
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

# Late Provisioning Commands
d-i preseed/late_command string \
  in-target sh -c "echo 'ocean ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/packer"; \
  in-target chmod 440 /etc/sudoers.d/packer; \
  in-target sh -c "sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config"; \
  in-target sh -c "grep -q '^PermitRootLogin' /etc/ssh/sshd_config && sed -i 's/^PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config || echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config"

# Finish Installation
d-i finish-install/reboot_in_progress note
